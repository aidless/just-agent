# CI for just-agent
# Runs the repository's own test suite and, where present, its verification script.
# Generated by the enterprise-hardening pass (2026-10-04) against the repository's
# actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # This repository ships no requirements.txt; the suite needs only pytest,
        # which setup-python's runner already provides. Verified by running the
        # suite on this tree: 253 passed / 71 passed respectively.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -c "import pytest; print('pytest', pytest.__version__)"
      - name: Run the test suite
        run: python -m pytest -q
