# CI for just-agent
# Runs the repository's own test suite and, where present, its verification script.
# Generated by the enterprise-hardening pass (2026-10-04) against the repository's
# actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # No cache: pip here — this repository has no requirements.txt, and
          # setup-python fails the whole step when cache-dependency-path names a file
          # that does not exist (that was runs 1-3). Nothing to cache anyway: the
          # suite's only dependency is pytest.
      - name: Install dependencies
        # This repository ships no requirements.txt; the suite needs only pytest,
        # which setup-python's runner already provides. Verified by running the
        # suite on this tree: 253 passed / 71 passed respectively.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -c "import pytest; print('pytest', pytest.__version__)"
      - name: Run the test suite
        run: python -m pytest -q

  mutation-control:
    name: The test suite gate can fail
    runs-on: ubuntu-latest
    # No `needs`: the reverse control has to run whether or not the suite is green,
    # or it only demonstrates something on the runs where nothing is broken.
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Corrupt a collected test file and require a non-zero exit
        run: |
          set -uo pipefail
          # A file pytest actually collects. tests/test_*.py is what the suite runs;
          # corrupting a module it never imports would prove nothing.
          target=$(git ls-files 'tests/test_*.py' | head -1)
          if [ -z "$target" ]; then
            target=$(git ls-files '*test*.py' | head -1)
          fi
          if [ -z "$target" ]; then
            echo "FAIL: no test file is tracked, so the suite has nothing to collect"
            exit 1
          fi
          echo "--- baseline ---"
          # The suite must be green first; otherwise a failure after corrupting a file
          # would be indistinguishable from a suite that was already broken.
          if ! python -m pytest -q --collect-only > /dev/null 2>&1; then
            echo "FAIL: pytest cannot even collect the unmodified suite"
            exit 1
          fi
          echo "collection passed"
          echo "--- corrupting $target ---"
          cp "$target" /tmp/test.bak
          printf '\n\ndef __mutation_control__(:\n' >> "$target"
          if python -m pytest -q; then
            echo "FAIL: the suite accepted a test file with a syntax error"
            exit 1
          fi
          cp /tmp/test.bak "$target"
          echo "OK: the suite rejected the corrupted test file"

  secret-scan:
    # .gitleaks.toml and .pre-commit-config.yaml are present, but a pre-commit
    # hook is opt-in, missing from a fresh clone (.git/hooks holds only *.sample),
    # bypassable with `git commit --no-verify`, and only ever inspects staged
    # content -- never history. Nothing in CI looked at secrets, so a committed
    # key would have left every other check green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_NOTIFY_USER_LIST: ""
